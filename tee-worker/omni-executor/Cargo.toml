[workspace]
members = [
    "bin",
    "cli",
    "clients/*",
    "crypto",
    "core",
    "intent/executors/cross-chain",
    "intent/executors/ethereum",
    "intent/executors/solana",
    "mock-server",
    "primitives",
    "rpc-server",
    "storage",
]

resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
alloy = "1.0.42"
alloy-rlp = "0.3.11"
alloy-signer = "1.0.9"
alloy-signer-local = "1.0.9"
anchor-client = "0.32.1"
async-trait = "0.1.82"
base58 = "0.2.0"
base64 = "0.22.1"
bincode = "2.0"
bitcoin = "0.32.5"
bs58 = "0.5"
chrono = "0.4.40"
ciborium = "0.2"
clap = "4.5.51"
email_address = "0.2"
ethabi = "18.0"
ethers = "2.0"
futures = "0.3.31"
hex = "0.4"
hex-literal = "1.1"
hmac = "0.12.1"
http = "1.3.1"
hyperliquid_rust_sdk = { git = "https://github.com/BillyWooo/hyperliquid-rust-sdk", branch = "fork_new_feature" }
jsonrpsee = { version = "0.26.0", features = ["server"] }
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
libsecp256k1 = "0.7.1"
log = "0.4.22"
metrics = "0.24.1"
metrics-exporter-prometheus = "0.17.2"
mockall = "0.13.1"
p256 = { version = "0.13", features = ["ecdsa"] }
parity-scale-codec = "3.6.12"
rand = "0.9.2"
regex = "1.7"
reqwest = { version = "0.12", features = ["json"] }
ring = "0.17.14"
rsa = "0.9.7"
ruint = "1.13.1"
rust_decimal = "1.37.1"
scale-encode = "0.10.0"
scale-info = "2.11.6"
secp256k1 = "=0.29.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1.20"
serde_with = { version = "3.15", features = ["hex"] }
sha2 = "0.10.8"
solana-client = "3.1.1"
solana-sdk = "3.0.0"
sp-core = "35.0.0"
spl-associated-token-account = "8.0.0"
spl-token = "8.0.0"
tempfile = "3.19.1"
test-log = { version = "0.2.17", features = ["trace"] }
thiserror = "2"
tokio = "1.43.0"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["auth", "sensitive-headers"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = "2.5.4"
uuid = "1.16.0"


# Local dependencies
accounting-contract = { path = "contracts/accounting/solana/programs/accounting-contract", features = ["no-entrypoint"] }
cross-chain-intent-executor = { path = "intent/executors/cross-chain" }
ethereum-intent-executor = { path = "intent/executors/ethereum" }
mock-server = { path = "mock-server" }
oe-client-aa = { path = "clients/aa" }
oe-client-accounting = { path = "clients/accounting" }
oe-client-binance = { path = "clients/binance" }
oe-client-ethereum = { path = "clients/ethereum" }
oe-client-hyperliquid = { path = "clients/hyperliquid" }
oe-client-pumpx = { path = "clients/pumpx" }
oe-client-signer = { path = "clients/signer" }
oe-client-solana = { path = "clients/solana" }
oe-client-wildmeta = { path = "clients/wildmeta" }
oe-core = { path = "core" }
oe-crypto = { path = "crypto" }
oe-primitives = { path = "primitives" }
oe-storage = { path = "storage" }
rpc-server = { path = "rpc-server" }
solana-intent-executor = { path = "intent/executors/solana" }

heima-primitives = { path = "../../parachain/primitives", default-features = false, features = ["std"] }
heima-utils = { path = "../../parachain/utils", default-features = false, features = ["std"] }

[workspace.lints.clippy]
result_unit_err = "allow"
