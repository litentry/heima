[workspace]
members = [
    "bin",
    "cli",
    "clients/*",
    "crypto",
    "core",
    "intent/executors/cross-chain",
    "intent/executors/ethereum",
    "intent/executors/solana",
    "mock-server",
    "primitives",
    "rpc-server",
    "storage",
]

resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
alloy = "2.0.5"
alloy-rlp = "0.3.15"
alloy-signer = "2.0.5"
alloy-signer-local = "2.0.5"
anchor-client = "1.0.2"
async-trait = "0.1.89"
base58 = "0.2.0"
base64 = "0.22.1"
bincode = "1.3"
bitcoin = "0.32.8"
bs58 = "0.5.1"
chrono = "0.4.44"
ciborium = "0.2"
clap = "4.6.1"
email_address = "0.2.9"
ethabi = "18.0"
ethers = "2.0"
futures = "0.3.32"
hex = "0.4"
hex-literal = "1.1"
hmac = "0.13.0"
http = "1.4.1"
hyperliquid_rust_sdk = { git = "https://github.com/BillyWooo/hyperliquid-rust-sdk", branch = "fork_new_feature" }
jsonrpsee = { version = "0.26.0", features = ["server"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
libsecp256k1 = "0.7.2"
log = "0.4.30"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
mockall = "0.15.0"
p256 = { version = "0.13.2", features = ["ecdsa"] }
parity-scale-codec = "3.6.12"
rand = "0.10.1"
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["json", "form", "query"] }
ring = "0.17.14"
rsa = "0.9.10"
ruint = "1.18.0"
rust_decimal = "1.42.0"
scale-encode = "0.10.1"
scale-info = "2.11.6"
secp256k1 = "=0.29.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
serde_with = { version = "3.20", features = ["hex"] }
sha2 = "0.10.8"
# ZK proof generation
ark-bn254 = "0.6.0"
# Use singlepass backend to avoid JIT (cranelift requires mmap+PROT_EXEC, incompatible with SGX)
ark-circom = { version = "0.5.0", default-features = false, features = ["ethereum"] }
ark-ff = "0.6.0"
ark-groth16 = "0.6.0"
ark-relations = "0.6.0"
ark-std = "0.6.0"
light-poseidon = "0.4.0"
num-bigint = "0.5.1"
solana-client = "3"
solana-commitment-config = "3"
solana-sdk = "3"
solana-system-interface = "3"
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = false }
spl-associated-token-account = "8"
spl-token = "9"
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = "2"
tokio = "1.52.3"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["auth", "sensitive-headers"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = "1.23.2"
wasmer = { version = "7.2.0", default-features = false, features = ["singlepass", "sys"] }
wasmer-wasix = { version = "0.28.0", default-features = false, features = ["sys"] }


# Local dependencies
accounting-contract = { path = "contracts/accounting/solana/programs/accounting-contract", features = ["no-entrypoint"] }
cross-chain-intent-executor = { path = "intent/executors/cross-chain" }
ethereum-intent-executor = { path = "intent/executors/ethereum" }
mock-server = { path = "mock-server" }
oe-client-aa = { path = "clients/aa" }
oe-client-accounting = { path = "clients/accounting" }
oe-client-binance = { path = "clients/binance" }
oe-client-ethereum = { path = "clients/ethereum" }
oe-client-hyperliquid = { path = "clients/hyperliquid" }
oe-client-pumpx = { path = "clients/pumpx" }
oe-client-signer = { path = "clients/signer" }
oe-client-solana = { path = "clients/solana" }
oe-client-wildmeta = { path = "clients/wildmeta" }
oe-core = { path = "core" }
oe-crypto = { path = "crypto" }
oe-primitives = { path = "primitives" }
oe-storage = { path = "storage" }
rpc-server = { path = "rpc-server" }
solana-intent-executor = { path = "intent/executors/solana" }

heima-primitives = { path = "../../parachain/primitives", default-features = false, features = ["std"] }
heima-utils = { path = "../../parachain/utils", default-features = false, features = ["std"] }

[workspace.lints.clippy]
result_unit_err = "allow"

[patch.crates-io]
# Patched to reduce initial Wasm memory from 2000 pages (128MB) to 150 pages (9.6MB)
# The withdraw circuit only needs 38 pages; 2000 causes mmap failures inside SGX enclaves
ark-circom = { path = "vendor/ark-circom" }
