[workspace]
members = [
    "accounting-contract-client",
    "binance-api",
    "ethereum-rpc",
    "executor-crypto",
    "executor-core",
    "executor-worker",
    "executor-storage",
    "executor-primitives",
    "heima/authentication",
    "heima/identity-verification",
    "intent/asset-lock",
    "intent/executors/cross-chain",
    "intent/executors/ethereum",
    "intent/executors/solana",
    "intent/token-query",
    "native-task-handler",
    "oauth-providers",
    "parentchain/listener",
    "parentchain/api-interface",
    "parentchain/attestation",
    "parentchain/rpc-client",
    "parentchain/signer",
    "pumpx",
    "rpc-server",
    "solana",
]

resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
alloy = "0.12.5"
async-trait = "0.1.82"
base58 = "0.2.0"
base64 = "0.22.1"
bitcoin = "0.32.5"
bs58 = "0.5"
chrono = "0.4.40"
clap = "4.5.17"
ethers = "2.0"
frame-support = { version = "39.0.0", features = ["std"] }
futures = "0.3.31"
hex = "0.4"
hex-literal = "0.4"
hmac = "0.12.1"
jsonrpsee = { version = "0.24", features = ["server"] }
jsonwebtoken = "9.3.0"
libsecp256k1 = "0.7.1"
metrics = "0.24.1"
metrics-exporter-prometheus = "0.16.2"
mockall = "0.13.1"
parity-scale-codec = "3.6.12"
rand = "0.8.5"
regex = "1.7"
reqwest = { version = "0.12", features = ["json"] }
ring = "0.16.20"
rsa = "0.9.7"
rust_decimal = "1.37.1"
scale-encode = "0.10.0"
scale-info = "2.11.6"
secp256k1 = "=0.29.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1.20"
serde_with = { version = "3.11", features = ["hex"] }
sha2 = "0.10.8"
solana-client = "2.1.5"
solana-sdk = "2.1.5"
sp-core = "35.0.0"
sp-state-machine = { version = "0.44.0", features = ["std"] }
spl-associated-token-account = "6.0.0"
spl-token = "7.0.0"
subxt = "0.40.0"
subxt-core = "0.40.0"
subxt-signer = { version = "0.40.0", features = ["subxt"] }
tempfile = "3.19.1"
tokio = "1.43.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = "2.5.4"

# Local dependencies
accounting-contract-client = { path = "accounting-contract-client" }
binance-api = { path = "binance-api" }
cross-chain-intent-executor = { path = "intent/executors/cross-chain" }
ethereum-intent-executor = { path = "intent/executors/ethereum" }
ethereum-rpc = { path = "ethereum-rpc" }
executor-core = { path = "executor-core" }
executor-crypto = { path = "executor-crypto" }
executor-primitives = { path = "executor-primitives" }
executor-storage = { path = "executor-storage" }
heima-authentication = { path = "heima/authentication" }
heima-hex-utils = { package = "litentry-hex-utils", path = "../../common/utils/hex", default-features = false, features = ["std"] }
heima-identity-verification = { path = "heima/identity-verification" }
heima-primitives = { package = "core-primitives", path = "../../common/primitives/core", default-features = false, features = ["std"] }
intent-asset-lock = { path = "intent/asset-lock" }
intent-token-query = { path = "intent/token-query" }
native-task-handler = { path = "native-task-handler" }
oauth-providers = { path = "oauth-providers" }
parentchain-api-interface = { path = "parentchain/api-interface" }
parentchain-attestation = { path = "parentchain/attestation" }
parentchain-listener = { path = "parentchain/listener" }
parentchain-rpc-client = { path = "parentchain/rpc-client" }
parentchain-signer = { path = "parentchain/signer" }
pumpx = { path = "pumpx" }
rpc-server = { path = "rpc-server" }
solana = { path = "solana" }
solana-intent-executor = { path = "intent/executors/solana" }

[workspace.lints.clippy]
result_unit_err = "allow"
