[package]
name = "executor-worker"
version = "0.1.0"
authors = ['Trust Computing GmbH <info@litentry.com>']
edition.workspace = true

[dependencies]
alloy = { workspace = true, features = ["signer-local"] }
clap = { workspace = true, features = ["derive"] }
ethers = { workspace = true }
hex = { workspace = true }
jsonrpsee = { workspace = true, features = ["ws-client"] }
metrics-exporter-prometheus = { workspace = true }
rand = { workspace = true }
rsa = { workspace = true }
rust_decimal = { workspace = true }
scale-encode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

# Local dependencies
cross-chain-intent-executor = { workspace = true }
mock-server = { workspace = true }
oe-client-aa = { workspace = true }
oe-client-accounting = { workspace = true }
oe-client-binance = { workspace = true }
oe-client-ethereum = { workspace = true }
oe-client-pumpx = { workspace = true }
oe-client-signer = { workspace = true }
oe-client-solana = { workspace = true }
oe-client-wildmeta = { workspace = true }
oe-core = { workspace = true }
oe-crypto = { workspace = true }
oe-primitives = { workspace = true }
oe-storage = { workspace = true }
rpc-server = { workspace = true }

[features]
default = []
mock-server = []
test-endpoints = ["rpc-server/test-endpoints"]

[lints]
workspace = true
