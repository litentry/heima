services:
  omni-executor:
    image: litentry/omni-executor:latest
    container_name: omni-executor
    build:
      context: ${PWD}/../../
      dockerfile: tee-worker/omni-executor/Dockerfile
      target: executor-worker
    volumes:
      - ../local:/local
    environment:
      - RUST_LOG=debug
    depends_on:
      ethereum-node:
        condition: service_started
      litentry-node:
        condition: service_healthy
        restart: true
    command: ["executor-worker", "run", "ws://litentry-node:9944", "http://ethereum-node:8545", "https://api.devnet.solana.com", "2100"]
    privileged: true
    restart: unless-stopped
    networks:
      - litentry-test-network
    ports:
      - "2100:2100"
    healthcheck:
      test: [ "CMD-SHELL", "curl -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"get_health\",\"id\":1}' http://localhost:2100 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  ethereum-node:
    image: ghcr.io/foundry-rs/foundry
    container_name: ethereum-node
    command:
      - "anvil --host 0.0.0.0 --block-time 1"
    ports:
      - "8545:8545"
  # fund-eth-account:
  #   image: ghcr.io/foundry-rs/foundry
  #   container_name: fund-eth-account
  #   command:
  #     - "cast send --private-key 0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6 0xf8d392519239c01a3a7a7a85d23abc2094d0ce53 --value 0.1ether -r http://ethereum-node:8545"
  #   depends_on:
  #     - ethereum-node
  litentry-node:
    image: litentry/litentry-parachain:latest
    container_name: litentry-node
    ports:
      - "9944:9944"
    command: ["--dev", "--rpc-external", "--rpc-port", "9944"]
    networks:
      - litentry-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9944"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval:  5s

networks:
  litentry-test-network:
    driver: bridge
