services:
  omni-executor:
    image: litentry/omni-executor:latest
    container_name: omni-executor
    build:
      context: ..
      dockerfile: Dockerfile.local
      target: executor-worker
    volumes:
      - ../local/keystore:/local/keystore
      - shared_contracts:/shared:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - ../.env
    environment:
      - RUST_LOG=${RUST_LOG:-debug}
      # RPC URLs moved from CLI args to environment variables (see commit 8803b7dd)
      - OE_ETHEREUM_URL=http://ethereum-node:8545
      - OE_SOLANA_URL=https://api.devnet.solana.com
      - OE_PUMPX_WORKER_URL=ws://omni-executor:2100
      - OE_PUMPX_API_BASE_URL=http://omni-executor:3456/pumpx/
      - OE_PUMPX_SIGNER_URL=http://omni-executor:3456/jsonrpc
      - OE_MAILER_TYPE_HEIMA=console
      # These should be set in the .env file or overridden as needed:
      # - OE_BSC_URL=
      # - OE_BSC_TESTNET_URL=
      # - OE_PUMPX_SIGNER_URL=
    depends_on:
      ethereum-node:
        condition: service_started
      aa-contracts-deploy:
        condition: service_completed_successfully
    entrypoint: ["/entrypoint.sh"]
    command: ["executor-worker", "run", "--enable-mock-server"]
    privileged: true
    restart: unless-stopped
    networks:
      - litentry-test-network
    ports:
      - "2100:2100"
      - "3456:3456"
      - "9090:9090"
    healthcheck:
      test: [ "CMD-SHELL", "curl -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"omni_getHealth\",\"id\":1}' http://localhost:2100 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  ethereum-node:
    image: ghcr.io/foundry-rs/foundry
    container_name: ethereum-node
    command:
      - "anvil -vv --host 0.0.0.0 --block-time 1 --chain-id 31337"
    ports:
      - "8545:8545"
    networks:
      - litentry-test-network

  aa-contracts-deploy:
    build:
      context: ..
      dockerfile: aa-contracts/Dockerfile.deploy
    container_name: aa-contracts-deploy
    volumes:
      - shared_contracts:/shared
    depends_on:
      - ethereum-node
    networks:
      - litentry-test-network
    restart: "no"
    user: "0:0"
  fund-eth-account:
    image: ghcr.io/foundry-rs/foundry
    container_name: fund-eth-account
    command:
      - "cast send --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 0x63a1FdC2e52008c98a5C8EEa182F5cB2612F21EC --value 10ether -r http://ethereum-node:8545"
    depends_on:
      ethereum-node:
        condition: service_started
    networks:
      - litentry-test-network
    restart: "no"

networks:
  litentry-test-network:
    driver: bridge

volumes:
  shared_contracts:
    driver: local
