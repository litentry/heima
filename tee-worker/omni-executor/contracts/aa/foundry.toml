[profile.default]
src = "src"
out = "out"
libs = ["lib", "../lib/forge-libs"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
via_ir = true
# Deterministic bytecode settings for CREATE2 deployments
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./test_deployments" },
    { access = "read-write", path = "./broadcast" }
]
gas_reports = ["*"]
gas_reports_ignore = []

[lint]
lint_on_build = false
# Note: Disabled due to Forge 1.4.4+ linting transitive imports in third-party libs
# Linting can be re-enabled once Forge properly supports ignore patterns for dependencies

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
