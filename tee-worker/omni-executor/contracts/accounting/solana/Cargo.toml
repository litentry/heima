[workspace]
members = [
    "programs/*",
    "tests",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# Anchor dependencies
anchor-client = "0.32.1"
anchor-lang = { version = "0.32", features = ["init-if-needed"] }

# Serialization
bincode = "1.3"
serde = { version = "1.0.217", features = ["derive"] }

# CLI
clap = { version = "4.5.51", features = ["derive"] }

# Utilities
hex = "0.4"
tokio = { version = "1.43.0", features = ["full"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
