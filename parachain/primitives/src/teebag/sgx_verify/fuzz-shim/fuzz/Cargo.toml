[package]
name = "sgx-verify-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = { version = "0.13", default-features = false, features = ["alloc"] }
der = { version = "0.7", default-features = false }
heima-primitives = { path = "../../../../../" }
libfuzzer-sys = { version = "0.4" }
parity-scale-codec = { version = "3.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0" }
x509-cert = { version = "0.2", default-features = false }

[[bin]]
name = "decode_quote"
path = "fuzz_targets/decode_quote.rs"
test = false
doc = false

[[bin]]
name = "deserialize_json"
path = "fuzz_targets/deserialize_json.rs"
test = false
doc = false

[[bin]]
name = "signature_check"
path = "fuzz_targets/signature_check.rs"
test = false
doc = false

[[bin]]
name = "extract_tcb_info"
path = "fuzz_targets/extract_tcb_info.rs"
test = false
doc = false
