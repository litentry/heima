version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/parachain"
      - "/tee-worker/omni-executor"
    labels: ["automated-pr"]
    # Handle updates for crates from github.com/paritytech/substrate manually.
    ignore:
      - dependency-name: "substrate-*"
      - dependency-name: "sc-*"
      - dependency-name: "sp-*"
      - dependency-name: "frame-*"
      - dependency-name: "fork-tree"
      - dependency-name: "remote-externalities"
      - dependency-name: "pallet-*"
      - dependency-name: "beefy-*"
      - dependency-name: "try-runtime-*"
      - dependency-name: "test-runner"
      - dependency-name: "generate-bags"
      - dependency-name: "sub-tokens"
      - dependency-name: "polkadot-*"
      - dependency-name: "xcm*"
      - dependency-name: "kusama-*"
      - dependency-name: "westend-*"
      - dependency-name: "cumulus-*"
      - dependency-name: "heima-*"
      - dependency-name: "moonbeam-*"
      - dependency-name: "fp-*"
      - dependency-name: "fc-*"
      - dependency-name: "pallet-evm"
      - dependency-name: "pallet-ethereum"
      - dependency-name: "pallet-evm-*"
      - dependency-name: "heima-utils-proc-macros" # still used by id-worker
    reviewers:
      - "litentry/parachain"
    schedule:
      interval: "weekly"
      
  - package-ecosystem: "npm"
    directories:
      - "/parachain/ts-tests"
      - "/parachain/scripts/ts-utils"
      - "/tee-worker/omni-executor/client-sdk"
      - "/tee-worker/omni-executor/ts-tests"
      - "/tee-worker/omni-executor/ts-tests/integration-tests"
      - "/tee-worker/omni-executor/accounting-contract/solana"
    labels: ["automated-pr"]
    groups:
      typescript-dependencies:
        patterns:
          - "*"
    reviewers:
      - "litentry/parachain"
    schedule:
      interval: "weekly"

  # Explicitly ignore aa-demo-app dependencies
  - package-ecosystem: "npm"
    directory: "/tee-worker/omni-executor/aa-contracts/aa-demo-app"
    open-pull-requests-limit: 0

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    labels: ["automated-pr"]
    groups:
      github-actions:
        patterns:
          - "*"
    reviewers:
      - "litentry/parachain"
    schedule:
      interval: "weekly"
