version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/parachain"
      - "/tee-worker/omni-executor"
    labels: ["automated-pr"]
    # Handle updates for crates from github.com/paritytech/substrate manually.
    ignore:
      - dependency-name: "substrate-*"
      - dependency-name: "sc-*"
      - dependency-name: "sp-*"
      - dependency-name: "frame-*"
      - dependency-name: "fork-tree"
      - dependency-name: "remote-externalities"
      - dependency-name: "pallet-*"
      - dependency-name: "beefy-*"
      - dependency-name: "try-runtime-*"
      - dependency-name: "test-runner"
      - dependency-name: "generate-bags"
      - dependency-name: "sub-tokens"
      - dependency-name: "polkadot-*"
      - dependency-name: "xcm*"
      - dependency-name: "kusama-*"
      - dependency-name: "westend-*"
      - dependency-name: "heima-*"
    reviewers:
      - "litentry/parachain"
    schedule:
      interval: "weekly"
      
  # npm dependencies for parachain
  - package-ecosystem: "npm"
    directory: "/parachain"
    labels: ["automated-pr"]
    groups:
      typescript-dependencies:
        patterns:
          - "*"
    reviewers:
      - "litentry/parachain"
    schedule:
      interval: "weekly"

  # npm dependencies for omni-executor
  - package-ecosystem: "npm"
    directory: "/tee-worker/omni-executor"
    labels: ["automated-pr"]
    groups:
      typescript-dependencies:
        patterns:
          - "*"
    reviewers:
      - "litentry/parachain"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    labels: ["automated-pr"]
    groups:
      github-actions:
        patterns:
          - "*"
    reviewers:
      - "litentry/parachain"
    schedule:
      interval: "weekly"
