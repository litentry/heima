version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    labels: ["automated-pr"]
    # Handle updates for crates from github.com/paritytech/substrate manually.
    ignore:
      - dependency-name: "substrate-*"
      - dependency-name: "sc-*"
      - dependency-name: "sp-*"
      - dependency-name: "frame-*"
      - dependency-name: "fork-tree"
      - dependency-name: "remote-externalities"
      - dependency-name: "pallet-*"
      - dependency-name: "beefy-*"
      - dependency-name: "try-runtime-*"
      - dependency-name: "test-runner"
      - dependency-name: "generate-bags"
      - dependency-name: "sub-tokens"
      - dependency-name: "polkadot-*"
      - dependency-name: "xcm*"
      - dependency-name: "kusama-*"
      - dependency-name: "westend-*"
      - dependency-name: "heima-*"
    reviewers:
      - "litentry/parachain"
    schedule:
      interval: "weekly"

  # Add configuration for all TypeScript files
  - package-ecosystem: "npm"
    directory: "/"
    labels: ["automated-pr"]
    ignore:
      # Ignore all npm dependencies in identity-worker related directories
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
        paths:
          - "tee-worker/identity/**"
    groups:
      typescript-dependencies:
        patterns:
          - "*"
    reviewers:
      - "litentry/parachain"
    schedule:
      interval: "weekly"

  - package-ecosystem: github-actions
    directory: '/'
    labels: ["automated-pr"]
    groups:
      github-actions:
        patterns:
          - "*"
    reviewers:
      - "litentry/parachain"
    schedule:
      interval: "weekly"
